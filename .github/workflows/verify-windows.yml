name: Verify Windows player
on:
  workflow_dispatch:
    inputs:
      package_sha256:
        description: Expected Windows ZIP SHA256
        required: true
permissions:
  contents: read
jobs:
  native-player:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Download read-only package and verify checksum
        shell: pwsh
        env:
          PACKAGE_URL: ${{ secrets.WINDOWS_VERIFY_URL }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          curl.exe --fail --silent --show-error --location $env:PACKAGE_URL --output package/TotalRush-Windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Package download failed' }
          if ((Get-FileHash package/TotalRush-Windows-x64.zip -Algorithm SHA256).Hash -ne $env:PACKAGE_SHA256) { throw 'Checksum mismatch' }
          Expand-Archive package/TotalRush-Windows-x64.zip player
      - name: Launch native x64 acceptance test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path verification | Out-Null
          $output = Join-Path $PWD verification
          $exe = Get-ChildItem player -Recurse -Filter 'Total Rush.exe'
          if (@($exe).Count -ne 1) { throw 'Expected one Total Rush executable' }
          $proc = Start-Process $exe.FullName -ArgumentList @('-batchmode','-nographics','-rush-020-headless','-verificationPath',('"'+$output+'"'),'-logFile',('"'+$output+'\player.log"')) -PassThru
          if (-not $proc.WaitForExit(120000)) { $proc.Kill(); throw 'Native player timed out' }
          if ($proc.ExitCode -ne 0) { throw "Native player failed: $($proc.ExitCode)" }
          $checks = Get-Content verification/results.txt
          if ($checks.Count -ne 16 -or @($checks | Where-Object { $_ -notmatch '^PASS ' }).Count -ne 0) { throw 'Acceptance checks failed or incomplete' }
          Get-Content verification/results.txt
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-player-verification
          path: verification/
          retention-days: 14
